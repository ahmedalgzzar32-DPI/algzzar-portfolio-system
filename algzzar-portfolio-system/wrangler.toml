name = "algzzar-portfolio-system"
main = "backend/server.js"
compatibility_date = "2024-01-01"
account_id = "your_account_id"

# ============== CLOUDFLARE PAGES CONFIGURATION ==============
[build]
command = "npm run build:cf"
cwd = "."
root_dir = "."
watch_paths = ["backend/**/*.js", "package.json"]

[env.production]
name = "algzzar-portfolio-system-prod"
routes = [
  { pattern = "yourdomain.com/*", zone_name = "yourdomain.com" }
]

[env.development]
name = "algzzar-portfolio-system-dev"
routes = [
  { pattern = "preview.yourdomain.com/*", zone_name = "yourdomain.com" }
]

# ============== ENVIRONMENT VARIABLES ==============
# ملاحظة: أضف هذه المتغيرات في Cloudflare Pages Dashboard
# - MONGODB_URI
# - JWT_SECRET
# - CLOUDINARY_CLOUD_NAME
# - CLOUDINARY_API_KEY
# - CLOUDINARY_API_SECRET
# - NODE_ENV=production
# - BACKEND_URL

# ============== KV NAMESPACES (Optional) ==============
# [[kv_namespaces]]
# binding = "KV_STORE"
# id = "your_kv_namespace_id"
# preview_id = "your_kv_preview_id"

# ============== D1 DATABASE (Optional) ==============
# [[d1_databases]]
# binding = "DB"
# database_name = "algzzar_portfolio"
# database_id = "your_d1_database_id"

# ============== OBSERVABILITY ==============
[observability]
enabled = true
